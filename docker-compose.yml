# version: '3'  <-- can be safely removed (optional)
services:
  client:
    build: ./client
    volumes:
      - ./client:/app
      - /app/node_modules  # Avoid mapping issues
    ports:
      - '3000:80'
    env_file:
      - ./.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - server
      - mongo

  server:
    build: ./server
    volumes:
      - ./server:/app
      - /app/node_modules
    ports:
      - '5000:5000'
    env_file:
      - .env
    environment:
      - MONGODB_URI

# Removed the external `web` network
# Docker Compose will now auto-generate a default bridge network
