version: '3.8'

services:
  # MongoDB service
  mongodb:
    image: mongo:6.0
    container_name: yesj_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
    networks:
      - yesj_network

  # Backend service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: yesj_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/yesj?authSource=admin
    depends_on:
      - mongodb
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - yesj_network

  # Frontend service
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: yesj_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - yesj_network

# Volumes for data persistence
volumes:
  mongodb_data:
    driver: local

# Networks for service communication
networks:
  yesj_network:
    driver: bridge